name: CI

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  e2e:
    name: Playwright E2E
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

  build:
    name: Build (${{ matrix.os }})
    needs: e2e
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Electrobun devkit and toolchain
        run: bunx electrobun sync

      - name: Print SDK surface
        if: matrix.os == 'ubuntu-latest'
        run: |
          find .hutch/devkit -maxdepth 4 -not -path '*/node_modules/*' | sort | head -150
          echo '===== tsconfig'; cat .hutch/devkit/tsconfig.json || true
          echo '===== main/index.ts'; cat .hutch/devkit/api/sdks/main/index.ts || true
          echo '===== view/index.ts'; cat .hutch/devkit/api/sdks/view/index.ts || true

      - name: Upload SDK api for inspection
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-devkit-api
          path: .hutch/devkit/api/
          retention-days: 3

      - name: Build
        run: bunx electrobun build --env=stable

      - name: List build output
        shell: bash
        run: ls -R artifacts build 2>/dev/null | head -80 || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aueio-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
